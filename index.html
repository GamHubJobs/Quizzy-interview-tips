<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GamHub Jobs — Interview Tips</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ============ SCREEN 1: OPENING HOOK ============ -->
    <div class="screen" id="opening-screen">
        <div class="tiktok-banner">
            <svg class="tiktok-logo" viewBox="0 0 32 32" fill="white">
                <path d="M16.708 0.027c1.745-0.027 3.48-0.011 5.213-0.027 0.105 2.041 0.839 4.12 2.333 5.563 1.491 1.479 3.6 2.156 5.652 2.385v5.369c-1.923-0.063-3.855-0.463-5.6-1.291-0.76-0.344-1.468-0.787-2.161-1.24-0.009 3.896 0.016 7.787-0.025 11.667-0.104 1.864-0.719 3.719-1.803 5.255-1.744 2.557-4.771 4.224-7.88 4.276-1.907 0.109-3.812-0.411-5.437-1.369-2.693-1.588-4.588-4.495-4.864-7.615-0.032-0.667-0.043-1.333-0.016-1.984 0.24-2.537 1.495-4.964 3.443-6.615 2.208-1.923 5.301-2.839 8.197-2.297 0.027 1.975-0.052 3.948-0.052 5.923-1.323-0.428-2.869-0.308-4.025 0.495-0.844 0.547-1.485 1.385-1.819 2.333-0.276 0.676-0.197 1.427-0.181 2.145 0.317 2.188 2.421 4.027 4.667 3.828 1.489-0.016 2.916-0.88 3.692-2.145 0.251-0.443 0.532-0.896 0.547-1.417 0.131-2.385 0.079-4.76 0.095-7.145 0.011-5.375-0.016-10.735 0.025-16.093z"></path>
            </svg>
            <span class="tiktok-text">FOLLOW TIKTOK @gamhubjobs</span>
        </div>

        <div class="promo-card">
            <div class="icon-row">
                <div class="icon-panel-interview">
                    <div class="icon-emoji"></div>
                    <div class="icon-label"></div>
                </div>
            </div>

            <div class="promo-content">
                <div class="promo-text" id="open-text1">
                    INTERVIEW TIPS<br>
                    THAT COULD ACTUALLY <span class="highlight">HELP YOU GET HIRED</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ SCREEN 2: INTERVIEW TIPS ============ -->
    <div class="screen" id="content-screen">
        <div class="progress-badge" id="progress-badge">
            TIP 1/4
            <span class="type-tag" id="type-tag">INTERVIEW TIP #1</span>
        </div>

        <div class="tip-card" id="tip-card">
            <div class="tiktok-banner">
                <svg class="tiktok-logo" viewBox="0 0 32 32" fill="white">
                    <path d="M16.708 0.027c1.745-0.027 3.48-0.011 5.213-0.027 0.105 2.041 0.839 4.12 2.333 5.563 1.491 1.479 3.6 2.156 5.652 2.385v5.369c-1.923-0.063-3.855-0.463-5.6-1.291-0.76-0.344-1.468-0.787-2.161-1.24-0.009 3.896 0.016 7.787-0.025 11.667-0.104 1.864-0.719 3.719-1.803 5.255-1.744 2.557-4.771 4.224-7.88 4.276-1.907 0.109-3.812-0.411-5.437-1.369-2.693-1.588-4.588-4.495-4.864-7.615-0.032-0.667-0.043-1.333-0.016-1.984 0.24-2.537 1.495-4.964 3.443-6.615 2.208-1.923 5.301-2.839 8.197-2.297 0.027 1.975-0.052 3.948-0.052 5.923-1.323-0.428-2.869-0.308-4.025 0.495-0.844 0.547-1.485 1.385-1.819 2.333-0.276 0.676-0.197 1.427-0.181 2.145 0.317 2.188 2.421 4.027 4.667 3.828 1.489-0.016 2.916-0.88 3.692-2.145 0.251-0.443 0.532-0.896 0.547-1.417 0.131-2.385 0.079-4.76 0.095-7.145 0.011-5.375-0.016-10.735 0.025-16.093z"></path>
                </svg>
                <span class="tiktok-text">FOLLOW TIKTOK @gamhubjobs</span>
            </div>

            <div class="timer-section">
                <div class="timer-container">
                    <div class="timer" id="timer"></div>
                </div>
                <div class="countdown hidden" id="countdown">5</div>
            </div>

            <div class="stage-area" id="stage-area">
                <!-- Stage 1: hook / question -->
                <div class="stage hook-stage" id="hook-stage">
                    <div class="stage-icon">💭</div>
                    <div class="hook-text" id="hook-text"></div>
                </div>

                <!-- Stage 2: the actual interview tip, shown as two examples side by side.
                     No "mistake"/"better" labels — the example + Why It Works
                     explanation let the viewer work out which is stronger. -->
                <div class="stage content-stage" id="content-stage">
                    <span class="topic-badge badge-interview content-tag" id="content-tag"></span>
                    <div class="compare-row" id="compare-row">
                        <div class="compare-panel mistake" id="mistake-panel">
                            <div class="compare-label">A</div>
                            <img class="compare-image" id="mistake-image" alt="" style="display:none;">
                            <div class="compare-text" id="mistake-text" style="display:none;"></div>
                        </div>
                        <div class="compare-panel approach" id="approach-panel">
                            <div class="compare-label">B</div>
                            <img class="compare-image" id="approach-image" alt="" style="display:none;">
                            <div class="compare-text" id="approach-text" style="display:none;"></div>
                        </div>
                    </div>
                </div>

                <!-- Stage 3: why it works -->
                <div class="stage why-stage" id="why-stage">
                    <div class="stage-icon">💡</div>
                    <div class="why-title">WHY IT WORKS</div>
                    <div class="why-text" id="why-text"></div>
                    <div class="why-source" id="why-source"></div>
                </div>

                <div class="reveal-flash" id="reveal-flash"></div>
            </div>
        </div>
    </div>

    <!-- ============ SCREEN 3: ENGAGEMENT / SHARE SCREEN ============ -->
    <div class="screen" id="share-screen">
        <div class="tiktok-banner">
            <svg class="tiktok-logo" viewBox="0 0 32 32" fill="white">
                <path d="M16.708 0.027c1.745-0.027 3.48-0.011 5.213-0.027 0.105 2.041 0.839 4.12 2.333 5.563 1.491 1.479 3.6 2.156 5.652 2.385v5.369c-1.923-0.063-3.855-0.463-5.6-1.291-0.76-0.344-1.468-0.787-2.161-1.24-0.009 3.896 0.016 7.787-0.025 11.667-0.104 1.864-0.719 3.719-1.803 5.255-1.744 2.557-4.771 4.224-7.88 4.276-1.907 0.109-3.812-0.411-5.437-1.369-2.693-1.588-4.588-4.495-4.864-7.615-0.032-0.667-0.043-1.333-0.016-1.984 0.24-2.537 1.495-4.964 3.443-6.615 2.208-1.923 5.301-2.839 8.197-2.297 0.027 1.975-0.052 3.948-0.052 5.923-1.323-0.428-2.869-0.308-4.025 0.495-0.844 0.547-1.485 1.385-1.819 2.333-0.276 0.676-0.197 1.427-0.181 2.145 0.317 2.188 2.421 4.027 4.667 3.828 1.489-0.016 2.916-0.88 3.692-2.145 0.251-0.443 0.532-0.896 0.547-1.417 0.131-2.385 0.079-4.76 0.095-7.145 0.011-5.375-0.016-10.735 0.025-16.093z"></path>
            </svg>
            <span class="tiktok-text">FOLLOW TIKTOK @gamhubjobs</span>
        </div>

        <div class="promo-card">
            <div class="icon-row">
                <div class="icon-panel-interview">
                    <div class="icon-emoji"></div>
                    <div class="icon-label"></div>
                </div>
            </div>

            <div class="promo-content">
                <div class="promo-text" id="share-text1">BEFORE THE LAST TIP...</div>
                <div class="promo-text" id="share-text2"><span class="highlight">SHARE</span> THIS WITH SOMEONE JOB HUNTING</div>
                <div class="promo-text" id="share-text3">AND FOLLOW US FOR MORE INTERVIEW TIPS <span class="highlight"></span></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
